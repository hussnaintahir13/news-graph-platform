services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////app/data/newsgraph.db
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-please-change-me-in-prod}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SCHEDULER_ENABLED=true
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
